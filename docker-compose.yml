services:
  backend:
    image: minhchien2005/event-backend:latest
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env
    environment:
      - BACKEND_URL=http://13.212.10.232:8080
      - APP_CORS_ALLOWED_ORIGINS=https://pbl-5-event-manager.vercel.app
      - APP_FRONTEND_URL=https://pbl-5-event-manager.vercel.app
      - AI_SERVICE_URL=http://localhost:8000
    depends_on:
      ai:
        condition: service_started
    restart: unless-stopped

  ai:
    image: minhchien2005/event-ai:latest
    ports:
      - "8000:8000"
    env_file:
      - ./AI/.env
    environment:
      - BACKEND_URL=http://backend:8080
    restart: unless-stopped

  frontend:
    image: minhchien2005/event-frontend:latest
    ports:
      - "80:80"
    depends_on:
      - backend
      - ai
    restart: unless-stopped


