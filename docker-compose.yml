services:
  backend:
    image: minhchien2005/event-backend:latest
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env
    environment:
      - BACKEND_URL=http://localhost:8080
      - APP_CORS_ALLOWED_ORIGINS=http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost
      - APP_FRONTEND_URL=http://localhost:5173
      - AI_SERVICE_URL=http://ai:8000
    depends_on:
      ai:
        condition: service_started
    restart: unless-stopped

  ai:
    image: minhchien2005/event-ai:latest
    ports:
      - "8000:8000"
    env_file:
      - ./AI/.env
    environment:
      - BACKEND_URL=http://backend:8080
    restart: unless-stopped


